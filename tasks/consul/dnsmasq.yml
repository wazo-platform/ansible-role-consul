---
# Install and configure dnsmasq to forward the consul domain to the local
# consul DNS interface. Only used when systemd-resolved is not available.

- name: Install dnsmasq
  ansible.builtin.package:
    name: dnsmasq
    state: present

- name: Configure dnsmasq for consul
  ansible.builtin.template:
    src: dnsmasq-10-consul.j2
    dest: /etc/dnsmasq.d/10-consul
    owner: root
    group: root
    mode: "0644"
  notify: Restart dnsmasq

# Point the host libc resolver at dnsmasq. Without this, /etc/resolv.conf still
# lists the DHCP/upstream nameserver and glibc lookups bypass dnsmasq entirely,
# so consul domain forwarding never runs.
- name: Point the system resolver at dnsmasq
  ansible.builtin.lineinfile:
    path: /etc/resolv.conf
    regexp: ^nameserver 127.0.0.1
    line: nameserver 127.0.0.1
    insertbefore: BOF
    create: true
    owner: root
    group: root
    mode: "0644"
