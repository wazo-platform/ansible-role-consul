---
# Install and configure dnsmasq to forward the consul domain to the local
# consul DNS interface. Only used when systemd-resolved is not available.

- name: Install dnsmasq
  ansible.builtin.package:
    name: dnsmasq
    state: present

- name: Configure dnsmasq for consul
  ansible.builtin.template:
    src: dnsmasq-10-consul.j2
    dest: /etc/dnsmasq.d/10-consul
    owner: root
    group: root
    mode: "0644"
  notify: Restart dnsmasq

- name: Check how /etc/resolv.conf is managed
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: consul_resolv_conf

- name: Detach /etc/resolv.conf from its managing service
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  when: consul_resolv_conf.stat.islnk | default(false)

- name: Point the system resolver at dnsmasq
  ansible.builtin.lineinfile:
    path: /etc/resolv.conf
    regexp: ^nameserver 127.0.0.1
    line: nameserver 127.0.0.1
    insertbefore: BOF
    create: true
    owner: root
    group: root
    mode: "0644"
    # /etc/resolv.conf is a bind mount inside containers, so the default atomic
    # rename fails with EBUSY. Write in place instead. (The symlink case above
    # has already been replaced with a regular file.)
    unsafe_writes: true
