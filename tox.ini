[tox]
env_list = linters, molecule-ansible8, molecule-ansible8-debian12, molecule-ansible13
no_package = true

[base]
deps =
  molecule
  molecule-plugins[docker]
  pytest-testinfra
pass_env =
  HOME
  SSH_AUTH_SOCK
  TERM
  TTY
set_env =
  ANSIBLE_HOME = {temp_dir}/ansible
  ANSIBLE_ROLES_PATH = {temp_dir}/ansible/roles
  ANSIBLE_COLLECTIONS_PATH = {temp_dir}/ansible/collections

[testenv:linters]
skip_install = true
deps = pre-commit
commands = pre-commit run --all-files

[testenv:molecule-ansible8]
deps =
  ansible~=8.0
  netaddr
  requests<2.32.0
  pytest<8.0.0
  setuptools<82
  {[base]deps}
pass_env = {[base]pass_env}
# Debian 11 is our reference for the dnsmasq path.
set_env =
  {[base]set_env}
  CONSUL_DNS_RESOLVER = dnsmasq
commands = molecule {posargs:test}

[testenv:molecule-ansible8-debian12]
deps = {[testenv:molecule-ansible8]deps}
pass_env = {[base]pass_env}
# Debian 12 ships systemd-resolved, so this env covers that path.
set_env =
  {[base]set_env}
  MOLECULE_DEBIAN_VERSION = 12
  CONSUL_DNS_RESOLVER = systemd-resolved
commands = molecule {posargs:test}

[testenv:molecule-ansible13]
deps =
  ansible<14
  netaddr
  pytest
  {[base]deps}
pass_env = {[base]pass_env}
set_env =
  {[base]set_env}
  MOLECULE_DEBIAN_VERSION = 13
  CONSUL_DNS_RESOLVER = systemd-resolved
commands = molecule {posargs:test}
