---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: molecule-consul-debian${MOLECULE_DEBIAN_VERSION:-11}
    image: 119948825560.dkr.ecr.eu-west-1.amazonaws.com/wazo-it-tools/debian-systemd:${MOLECULE_DEBIAN_VERSION:-11}
    privileged: True
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    cgroupns_mode: host
    command: /lib/systemd/systemd
provisioner:
  name: ansible
  log: true
  env:
    # Selects the DNS resolver path to exercise: "dnsmasq" or "systemd-resolved"
    # (default). Forwarded to both the prepare playbook and the testinfra checks.
    CONSUL_DNS_RESOLVER: ${CONSUL_DNS_RESOLVER:-systemd-resolved}
verifier:
  name: testinfra
  options:
    tb: short
